<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/Logo-Kejaksaan%20(1)(1).png?v=2" />
<link rel="shortcut icon" type="image/png" href="/Logo-Kejaksaan%20(1)(1).png?v=2" />
<link rel="apple-touch-icon" href="/Logo-Kejaksaan%20(1)(1).png?v=2" />

  <title>Form Monitoring Distribusi MBG - Kejaksaan Negeri Muna</title>

  <style>
    :root {
      --green-dark: #003b2d;
      --green-main: #006b43;
      --green-soft: #0f8a5f;
      --gold: #d7b45a;
      --white: #ffffff;
      --text-dark: #0f172a;
      --gray: #64748b;
      --border: #d9e2dc;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.18)
        ),
        url("https://raw.githubusercontent.com/ungumanggis199-svg/MBG-Muna/main/Background%20Form.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-dark);
    }

    .page-wrapper {
      width: 100%;
      min-height: 100vh;
      padding: 32px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-card {
      width: 100%;
      max-width: 880px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(0, 77, 54, 0.18);
      backdrop-filter: blur(10px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 18px;
      margin-bottom: 22px;
      border-bottom: 2px solid rgba(0, 77, 54, 0.12);
    }

    .logo {
      width: 78px;
      height: 78px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-small {
      font-size: 14px;
      font-weight: 700;
      color: var(--green-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-main {
      margin-top: 4px;
      font-size: 28px;
      font-weight: 800;
      color: var(--green-dark);
      text-transform: uppercase;
      line-height: 1.15;
    }

    .header-sub {
      margin-top: 6px;
      font-size: 14px;
      color: var(--gray);
    }

    .title {
      text-align: center;
      margin-bottom: 26px;
    }

    .title h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.2;
      color: var(--green-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .title p {
      margin: 8px 0 0;
      color: var(--gray);
      font-size: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .form-group {
      width: 100%;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--green-dark);
    }

    select,
    input[type="date"],
    textarea,
    input[type="file"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 14px;
      color: var(--text-dark);
      background: #ffffff;
      outline: none;
      transition: 0.2s ease;
    }

    select:focus,
    input[type="date"]:focus,
    textarea:focus,
    input[type="file"]:focus {
      border-color: var(--green-main);
      box-shadow: 0 0 0 4px rgba(0, 107, 67, 0.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    input[type="file"] {
      cursor: pointer;
      padding: 11px 12px;
    }

    .upload-note {
      margin-top: 6px;
      font-size: 12px;
      color: var(--gray);
    }

    .button-wrapper {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }

    .btn-save {
      min-width: 190px;
      padding: 14px 38px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.35);
      transition: 0.2s ease;
    }

    .btn-save:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #22c55e, #15803d);
    }

    .btn-save:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .message.success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    .footer-note {
      margin-top: 18px;
      text-align: center;
      color: var(--gray);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page-wrapper {
        padding: 20px 12px;
        align-items: flex-start;
      }

      .form-card {
        padding: 22px;
        border-radius: 18px;
      }

      .header {
        align-items: flex-start;
      }

      .logo {
        width: 62px;
        height: 62px;
      }

      .header-main {
        font-size: 20px;
      }

      .title h1 {
        font-size: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }

  .image-preview {
  display: none;
  margin-top: 10px;
  border: 1px solid #d1e0d7;
  border-radius: 12px;
  padding: 10px;
  background: rgba(255, 255, 255, 0.75);
}

.image-preview img {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 10px;
  display: block;
  background: #f8fafc;
}

.image-preview-name {
  display: block;
  margin-top: 7px;
  font-size: 12px;
  color: #52657a;
  word-break: break-all;
}
  </style>
</head>

<body>
  <main class="page-wrapper">
    <section class="form-card">

      <header class="header">
        <img
          src="https://raw.githubusercontent.com/ungumanggis199-svg/MBG-Muna/main/Logo-Kejaksaan%20%281%29%281%29.png"
          alt="Logo Kejaksaan"
          class="logo"
        />

        <div>
          <div class="header-small">Kejaksaan Republik Indonesia</div>
          <div class="header-main">Kejaksaan Negeri Muna</div>
          <div class="header-sub">Monitoring Program Makanan Bergizi Gratis</div>
        </div>
      </header>

      <div class="title">
        <h1>Monitoring Distribusi MBG</h1>
        <p>Form pengisian laporan distribusi Program Makanan Bergizi Gratis</p>
      </div>

      <form id="formMonitoring">
        <div class="form-grid">

          <div class="form-group">
            <label for="namaSppg">Nama SPPG</label>
            <select id="namaSppg" name="namaSppg" required>
        <option value="">Memuat List SPPG...</option>
        </select>
          </div>

          <div class="form-group">
            <label for="tanggal">Tanggal</label>
            <input type="date" id="tanggal" name="tanggal" required />
          </div>

          <div class="form-group full">
            <label for="menuMbg">Menu MBG</label>
            <textarea
              id="menuMbg"
              name="menuMbg"
              placeholder="Contoh: Nasi, ayam goreng, kacang polong goreng, buncis dan jagung rebus, saus sachet,...."
              required
            ></textarea>
          </div>

          <div class="form-group full">
            <label for="nilaiGizi">Nilai Gizi</label>
            <textarea
              id="nilaiGizi"
              name="nilaiGizi"
              placeholder="Contoh: Karbohidrat 45 gr, protein 15 gr, lemak 15gr "
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="fotoMenu">Foto Menu MBG</label>
            <input
  type="file"
  id="fotoMenu"
  name="fotoMenu"
  accept="image/*"
  onchange="previewSelectedImage(this, 'previewFotoMenu', 'previewFotoMenuName')"
  required
/>

<div class="image-preview" id="previewFotoMenu">
  <img src="" alt="Preview Foto Menu MBG">
  <span class="image-preview-name" id="previewFotoMenuName"></span>
</div>

          <div class="form-group">
            <label for="fotoDistribusi">Foto Distribusi</label>
            <input
  type="file"
  id="fotoDistribusi"
  name="fotoDistribusi"
  accept="image/*"
  onchange="previewSelectedImage(this, 'previewFotoDistribusi', 'previewFotoDistribusiName')"
  required
/>

<div class="image-preview" id="previewFotoDistribusi">
  <img src="" alt="Preview Foto Distribusi">
  <span class="image-preview-name" id="previewFotoDistribusiName"></span>
</div>

        </div>

        <div class="button-wrapper">
          <button type="submit" class="btn-save" id="btnSimpan">
            Simpan
          </button>
        </div>

        <div id="messageBox" class="message"></div>

        <div class="footer-note">
          Kejaksaan Negeri Muna · Monitoring Distribusi MBG
        </div>
      </form>

    </section>
  </main>

  <script>
  const form = document.getElementById("formMonitoring");
  const messageBox = document.getElementById("messageBox");
  const btnSimpan = document.getElementById("btnSimpan");

  const MAX_UPLOAD_SIZE = 5 * 1024 * 1024; // 5 MB
  const COMPRESS_MAX_WIDTH = 1600;
  const COMPRESS_MAX_HEIGHT = 1600;
  const JPEG_QUALITY = 0.82;

  document.addEventListener("DOMContentLoaded", async function () {
  const email = localStorage.getItem("mbg_email");
  const password = localStorage.getItem("mbg_password");
  const sppg = localStorage.getItem("mbg_sppg");

  if (!email || !password) {
    alert("Silakan login terlebih dahulu.");
    window.location.href = "/";
    return;
  }

  await loadListSPPG();

  if (sppg && sppg.toLowerCase() !== "admin") {
    const select = document.getElementById("namaSppg");

    const optionExists = Array.from(select.options).some(function(option) {
      return option.value.toLowerCase() === sppg.toLowerCase();
    });

    if (!optionExists) {
      const option = document.createElement("option");
      option.value = sppg;
      option.textContent = sppg;
      select.appendChild(option);
    }

    select.value = sppg;
  }
});

    async function loadListSPPG() {
  const select = document.getElementById("namaSppg");

  select.innerHTML = '<option value="">Memuat List SPPG...</option>';

  try {
    const res = await fetch("/api/list-sppg");
    const result = await res.json();

    if (!result.success) {
      select.innerHTML = '<option value="">Gagal memuat List SPPG</option>';
      showMessage(result.message || "Gagal mengambil List SPPG.", "error");
      return;
    }

    select.innerHTML = '<option value="">Pilih Nama SPPG</option>';

    if (!result.data || result.data.length === 0) {
      select.innerHTML = '<option value="">List SPPG masih kosong</option>';
      return;
    }

    result.data.forEach(function(namaSppg) {
      const option = document.createElement("option");
      option.value = namaSppg;
      option.textContent = namaSppg;
      select.appendChild(option);
    });

  } catch (error) {
    console.error(error);
    select.innerHTML = '<option value="">Gagal memuat List SPPG</option>';
    showMessage("Gagal terhubung ke server List SPPG.", "error");
  }
}

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = localStorage.getItem("mbg_email");
    const password = localStorage.getItem("mbg_password");

    if (!email || !password) {
      alert("Sesi login habis. Silakan login ulang.");
      window.location.href = "/";
      return;
    }

    const namaSppg = document.getElementById("namaSppg").value.trim();
    const tanggal = document.getElementById("tanggal").value;
    const menuMbg = document.getElementById("menuMbg").value.trim();
    const nilaiGizi = document.getElementById("nilaiGizi").value.trim();
    const fotoMenu = document.getElementById("fotoMenu").files[0];
    const fotoDistribusi = document.getElementById("fotoDistribusi").files[0];

    if (!namaSppg || !tanggal || !menuMbg || !nilaiGizi || !fotoMenu || !fotoDistribusi) {
      showMessage("Mohon lengkapi seluruh data terlebih dahulu.", "error");
      return;
    }

    if (fotoMenu.size > MAX_UPLOAD_SIZE) {
      showMessage("Foto Menu MBG maksimal 5 MB.", "error");
      return;
    }

    if (fotoDistribusi.size > MAX_UPLOAD_SIZE) {
      showMessage("Foto Distribusi maksimal 5 MB.", "error");
      return;
    }

    btnSimpan.disabled = true;
    btnSimpan.textContent = "Mengompresi foto...";

    try {
      const fotoMenuCompressed = await compressImageToBase64(fotoMenu, "foto-menu-mbg.jpg");
      const fotoDistribusiCompressed = await compressImageToBase64(fotoDistribusi, "foto-distribusi-mbg.jpg");

      btnSimpan.textContent = "Menyimpan...";

      const payload = {
        email: email,
        password: password,
        namaSppg: namaSppg,
        tanggal: tanggal,
        menuMbg: menuMbg,
        nilaiGizi: nilaiGizi,
        fotoMenu: fotoMenuCompressed,
        fotoDistribusi: fotoDistribusiCompressed
      };

      const res = await fetch("/api/save-monitoring", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const result = await res.json();

      if (result.success) {
        showMessage("Data Berhasil Disimpan", "success");

        form.reset();
        resetImagePreviews();

        const sppg = localStorage.getItem("mbg_sppg");
        if (sppg && sppg.toLowerCase() !== "admin") {
          document.getElementById("namaSppg").value = sppg;
        }

      } else {
        showMessage(
  (result.message || "Data gagal disimpan.") + 
  (result.detail ? " Detail: " + result.detail : ""),
  "error"
);
      }

    } catch (error) {
      console.error(error);
      showMessage("Gagal memproses foto atau mengirim data.", "error");

    } finally {
      btnSimpan.disabled = false;
      btnSimpan.textContent = "Simpan";
    }
  });

  function compressImageToBase64(file, newFileName) {
    return new Promise(function(resolve, reject) {
      if (!file.type.startsWith("image/")) {
        reject(new Error("File harus berupa gambar."));
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {
        const img = new Image();

        img.onload = function() {
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > COMPRESS_MAX_WIDTH) {
              height = Math.round(height * COMPRESS_MAX_WIDTH / width);
              width = COMPRESS_MAX_WIDTH;
            }
          } else {
            if (height > COMPRESS_MAX_HEIGHT) {
              width = Math.round(width * COMPRESS_MAX_HEIGHT / height);
              height = COMPRESS_MAX_HEIGHT;
            }
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
          const base64 = compressedDataUrl.split(",")[1];

          resolve({
            fileName: newFileName,
            mimeType: "image/jpeg",
            data: base64,
            originalName: file.name,
            originalSize: file.size,
            compressedInfo: "compressed-browser"
          });
        };

        img.onerror = function() {
          reject(new Error("Gagal membaca gambar. Gunakan format JPG, JPEG, atau PNG."));
        };

        img.src = event.target.result;
      };

      reader.onerror = function() {
        reject(new Error("Gagal membaca file gambar."));
      };

      reader.readAsDataURL(file);
    });
  }

  function showMessage(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
  }

  function previewSelectedImage(input, previewId, nameId) {
  const file = input.files[0];
  const previewBox = document.getElementById(previewId);
  const previewImg = previewBox.querySelector("img");
  const previewName = document.getElementById(nameId);

  if (!file) {
    previewBox.style.display = "none";
    previewImg.src = "";
    previewName.textContent = "";
    return;
  }

  if (!file.type.startsWith("image/")) {
    showMessage("File harus berupa gambar JPG, JPEG, atau PNG.", "error");
    input.value = "";
    previewBox.style.display = "none";
    previewImg.src = "";
    previewName.textContent = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    previewImg.src = e.target.result;
    previewName.textContent = file.name;
    previewBox.style.display = "block";
  };

  reader.readAsDataURL(file);
}

function resetImagePreviews() {
  const previews = [
    {
      box: "previewFotoMenu",
      name: "previewFotoMenuName"
    },
    {
      box: "previewFotoDistribusi",
      name: "previewFotoDistribusiName"
    }
  ];

  previews.forEach(function(item) {
    const box = document.getElementById(item.box);
    const name = document.getElementById(item.name);

    if (box) {
      const img = box.querySelector("img");
      if (img) img.src = "";
      box.style.display = "none";
    }

    if (name) {
      name.textContent = "";
    }
  });
}
    
</script>
</body>
</html>
